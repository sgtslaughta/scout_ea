services:
  web:
    build: .
    command: python serve.py
    ports:
      - "8765:8765"
    volumes:
      - eadata:/data
    environment:
      EA_DB_PATH: /data/ea.sqlite
      EA_WEB_PORT: 8765
      EA_MCP_PORT: 8766
      EA_MCP_TOKEN: ${EA_MCP_TOKEN}
      EA_MCP_PUBLIC_HOST: ${EA_MCP_PUBLIC_HOST:-localhost}

  mcp:
    build: .
    command: python -m mcp_server.server
    ports:
      - "8766:8766"
    volumes:
      - eadata:/data
    environment:
      EA_DB_PATH: /data/ea.sqlite
      EA_MCP_PORT: 8766
      EA_MCP_HOST: 0.0.0.0
      EA_MCP_TOKEN: ${EA_MCP_TOKEN}
      M365_MCP_URL: ${M365_MCP_URL:-}
      M365_MCP_TOKEN: ${M365_MCP_TOKEN:-}

volumes:
  eadata:
