# Scout EA — single-user install.
#
# Pulled by install/install.ps1 into %LOCALAPPDATA%\ScoutEA. Unlike the
# docker-compose.yml at the repo root, this one pulls a published image rather
# than building from source: the machine running it has one YAML file and no
# checkout.
#
# Both ports bind to 127.0.0.1 on purpose. This holds your mail, tasks and
# notes, and it has no login of its own -- the only thing keeping other
# machines out is that it never listens on the network. Scout runs on this same
# machine, so localhost is all it needs.
services:
  web:
    image: ghcr.io/sgtslaughta/scout_ea:latest
    command: python serve.py
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - eadata:/data
    environment:
      EA_DB_PATH: /data/ea.sqlite
      EA_WEB_PORT: 8765
      EA_MCP_PORT: 8766
      EA_MCP_TOKEN: ${EA_MCP_TOKEN}
      EA_MCP_PUBLIC_HOST: localhost

  mcp:
    image: ghcr.io/sgtslaughta/scout_ea:latest
    command: python -m mcp_server.server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - eadata:/data
    environment:
      EA_DB_PATH: /data/ea.sqlite
      EA_MCP_PORT: 8766
      EA_MCP_HOST: 0.0.0.0
      EA_MCP_TOKEN: ${EA_MCP_TOKEN}

volumes:
  eadata:
